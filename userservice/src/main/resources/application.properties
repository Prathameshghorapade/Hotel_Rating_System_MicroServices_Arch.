spring.application.name=USER-SERVICE

server.port=8027

#db_Config
spring.datasource.url=jdbc:mysql://localhost:3306/user_service
spring.datasource.username=root
spring.datasource.password=pratham
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.config.import= configserver:http://localhost:8095



#
## Eureka Server URL
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#
## Register this service with Eureka
#eureka.client.register-with-eureka=true
#
## Fetch registry (important for inter-service communication)
#eureka.client.fetch-registry=true
#
## Prefer IP address instead of hostname
#eureka.instance.prefer-ip-address=true



# Retry configuration
resilience4j.retry.instances.ratingHotelRetry.max-attempts=3
resilience4j.retry.instances.ratingHotelRetry.wait-duration=4s

# retry for all exceptions
resilience4j.retry.instances.ratingHotelRetry.retry-exceptions=java.lang.Exception



resilience4j.ratelimiter.instances.userRateLimiter.limit-for-period=4
resilience4j.ratelimiter.instances.userRateLimiter.limit-refresh-period=2s
resilience4j.ratelimiter.instances.userRateLimiter.timeout-duration=0s